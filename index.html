<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İTÜ Güncel Duyurular</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <meta name="description" content="İTÜ bölümlerinden güncel duyurularını tek bir sayfada toplayan günlük haber akışı.">
    <meta property="og:title" content="İTÜ Duyurular">
    <meta property="og:description" content="İTÜ bölümlerinden güncel duyurularını tek bir sayfada toplayan günlük haber akışı.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://buraknezir.github.io/itu-news-feed/">
    
    <style>
        :root { --primary: #002868; --text: #333; --light-gray: #e0e0e0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #fff; 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            line-height: 1.5;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { margin-bottom: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        header h1 { color: var(--primary); margin: 0; font-size: 1.8em; }
        header p { color: #666; font-size: 0.9em; margin: 5px 0 0 0; }
        
        .news-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--light-gray);
        }
        .news-item:last-child {
            border-bottom: none;
        }
        
        .news-meta {
            font-size: 0.85em;
            color: #555;
            margin-bottom: 5px;
        }
        .news-date {
            font-weight: bold;
            color: #000;
        }
        .news-dept {
            color: #666;
            margin-left: 10px;
        }
        .news-dept::before {
            content: "•";
            margin-right: 8px;
            color: #aaa;
        }
        
        .news-title {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            display: block;
        }
        .news-title:hover {
            text-decoration: underline;
        }
        
        .loading { text-align: center; color: #888; font-style: italic; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>İTÜ Duyurular</h1>
            <p>Son güncelleme: <span id="last-updated">Yükleniyor...</span></p>
        </header>
        <div id="news-feed">
            <p class="loading">Haberler yükleniyor...</p>
        </div>
    </div>

    <script>
        async function loadNews() {
            try {
                const response = await fetch('news.json?t=' + Date.now());
                if (!response.ok) throw new Error("Veri bulunamadı");
                const news = await response.json();
                
                const feed = document.getElementById('news-feed');
                feed.innerHTML = '';
                
                if (news.length === 0) {
                    feed.innerHTML = '<p class="loading">Ağustos 2026 sonrası haber bulunamadı.</p>';
                    return;
                }

                news.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'news-item';
                    div.innerHTML = `
                        <div class="news-meta">
                            <span class="news-date">${item.display_date}</span>
                            <span class="news-dept">${item.department}</span>
                        </div>
                        <a href="${item.link}" target="_blank" class="news-title">${item.title}</a>
                    `;
                    feed.appendChild(div);
                });

                const now = new Date();
                document.getElementById('last-updated').textContent = now.toLocaleString('tr-TR');
                
            } catch (error) {
                console.error(error);
                document.getElementById('news-feed').innerHTML = 
                    '<p class="loading">Haberler yüklenirken bir hata oluştu.</p>';
            }
        }
        loadNews();
    </script>
</body>
</html>
