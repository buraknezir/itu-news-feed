<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İTÜ Güncel Duyurular</title>
    <style>
        :root { --primary: #002868; --bg: #f4f7f6; --card: #ffffff; --text: #333; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary); margin-bottom: 5px; }
        header p { color: #666; font-size: 0.9em; }
        .card { background: var(--card); border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .date { font-size: 0.85em; color: #888; font-weight: bold; margin-bottom: 8px; display: block; }
        .title { font-size: 1.1em; font-weight: 600; color: var(--primary); text-decoration: none; display: block; line-height: 1.4; }
        .title:hover { text-decoration: underline; }
        .loading { text-align: center; color: #888; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>İTÜ Duyurular</h1>
            <p>Son güncelleme: <span id="last-updated">Yükleniyor...</span></p>
        </header>
        <div id="news-feed">
            <p class="loading">Haberler yükleniyor...</p>
        </div>
    </div>

    <script>
        async function loadNews() {
            try {
                const response = await fetch('news.json');
                if (!response.ok) throw new Error("Veri bulunamadı");
                const news = await response.json();
                
                const feed = document.getElementById('news-feed');
                feed.innerHTML = '';
                
                if (news.length === 0) {
                    feed.innerHTML = '<p class="loading">Ağustos 2026 sonrası haber bulunamadı.</p>';
                    return;
                }

                news.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <span class="date">${item.display_date}</span>
                        <a href="${item.link}" target="_blank" class="title">${item.title}</a>
                    `;
                    feed.appendChild(card);
                });

                // Update timestamp
                const now = new Date();
                document.getElementById('last-updated').textContent = now.toLocaleString('tr-TR');
                
            } catch (error) {
                console.error(error);
                document.getElementById('news-feed').innerHTML = 
                    '<p class="loading">Haberler yüklenirken bir hata oluştu. Lütfen daha sonra tekrar deneyin.</p>';
            }
        }
        loadNews();
    </script>
</body>
</html>
